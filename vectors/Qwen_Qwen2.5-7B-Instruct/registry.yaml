# Your own steering vectors for Qwen/Qwen2.5-7B-Instruct.
# The agent reads vectors/<model_slug>/registry.yaml at startup and can apply
# any listed vector via the `steer` tool. extract_contrastive.py and
# extract_vector.py add their vectors here automatically.
#
# Vectors from the community index (community/vectors.yaml), such as
# assistant_axis, are added at startup and aren't listed here. A vector listed
# here with the same name as an index vector replaces it.
#
# Strength units: percent of the typical residual-stream norm at `layer`
# (vectors are normalized to unit length before scaling), so the same strength
# is the same size push for every vector. Hard cap: MAX_STRENGTH in
# modulo/agent.py.
#
# Format:
#   name:           short identifier the agent uses in steer() calls
#   file:           filename in this directory
#   layer:          which decoder layer to inject at
#   description:    what the vector does (shown to the agent in its system prompt)
#   safe_strength_min/max: bounds the agent's steer() strength is clamped to
#   sign_convention: which sign does what (shown to the agent)
#   source:         where the vector came from (for attribution/reproducibility)
#   format:         'single' = [hidden_dim] tensor, 'per_layer' = [num_layers, hidden_dim]

# Add vectors below as you verify them. Example stub:
