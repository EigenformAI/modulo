schema_version: '0.1'
project: Pharmacopoeia
compiled: '2026-10-26'
notes:
  - 'Discovery catalogue, not a validated or directly executable recipe collection.'
  - 'artifact_status distinguishes published vectors from generation code, datasets, and papers.'
  - 'All strengths, layer choices, licensing, and model revisions require verification before execution.'
  - 'Do not load untrusted pickle/PT files without inspecting provenance and deserialization risk.'
entries:
  - id: persona-iclr26
    title: PERSONA dynamic personality control
    url: https://huggingface.co/datasets/xiachongfeng/persona
    artifact_status: downloadable_vectors
    models: [Qwen2.5-14B-Instruct, Qwen3-4B-Instruct-2507, Meta-Llama-3.1-8B-Instruct]
    behaviors: [inventive, consistent, dependable, careless, outgoing, solitary, compassionate, self-interested, nervous, calm]
    notes: 'Ten OCEAN trait poles; multiple vector extraction variants; check repository for exact model subdirectories.'
  - id: rotalabs-vectors
    title: Rotalabs steering vectors
    url: https://huggingface.co/rotalabs/steering-vectors
    artifact_status: downloadable_vectors
    models: [Qwen3-8B, Mistral-7B-Instruct-v0.2, Gemma-2-9B-IT]
    behaviors: [refusal, instruction_hierarchy, tool_restraint, uncertainty]
    notes: 'Available behavior/model combinations vary; not every behavior is available for each model.'
  - id: rotalabs-toolkit
    title: Rotalabs steer
    url: https://github.com/rotalabs/rotalabs-steer
    artifact_status: extraction_toolkit_and_contrast_pairs
    behaviors: [refusal, uncertainty, tool_restraint, instruction_hierarchy, formality, conciseness, creativity, assertiveness, humor, empathy, technical_depth]
    notes: 'Eleven contrast-pair datasets; not all listed behaviors have downloadable pretrained vectors.'
  - id: eigenwelt-emotion
    title: Emotion steering
    url: https://github.com/eigenweltlabs/emotion-steering
    artifact_status: extraction_and_serving_toolkit
    models: [Qwen3-8B, generic_HF_causal_LM]
    behaviors: [anger, disgust, fear, joy, sadness, surprise]
    notes: 'Ekman six emotion categories from GoEmotions; example vector bundle and vLLM/HF serving.'
  - id: nous-neural-steering
    title: Nous neural steering
    url: https://github.com/NousResearch/neural-steering
    artifact_status: circuit_discovery_and_steering_toolkit
    mechanism: sparse_neuron_scaling
    models: [Llama, Qwen, Mistral]
    behaviors: [refusal, belief, sentiment, sycophancy, factual_recall]
  - id: steering-vectors
    title: Steering vectors Python package
    url: https://github.com/steering-vectors/steering-vectors
